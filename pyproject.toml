[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-grasp-ctrl"
version = "0.1.0"
description = "Coordinated contact control for adaptive dexterous grasping under uncertainty"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "absl-py==2.4.0",
    "arm-pytorch-utilities==0.5.0",
    "hydra-core==1.3.2",
    "imageio==2.37.3",
    "lxml==6.0.2",
    "matplotlib==3.10.8",
    "mjviser==0.0.14",
    "mujoco==3.6.0",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "mingrui_utils_python==0.1",
    "pytorch_kinematics==0.7.5",
    "pytorch-seed==0.2.0",
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "scipy==1.15.3",
    "torch==2.2.2",
    "tqdm==4.67.3",
    "transforms3d==0.4.2",
    "trimesh==4.11.5",
    "viser==1.0.27",
]

[project.scripts]
ada-grasp-ctrl = "ada_grasp_ctrl.cli:main"

# The wheel contains Python code and Hydra configuration only. Hand MJCF,
# object data, and generated outputs are external roots configured at runtime.
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada_grasp_ctrl*"]

[tool.setuptools.package-data]
ada_grasp_ctrl = ["config/**/*.yaml"]

# https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
[tool.black]
line-length = 120
skip-magic-trailing-comma = false  # 保持默认
skip-string-normalization = false  # 保持默认
# 关键配置：让 Black 忽略注释长度
experimental-string-processing = false  # 禁用实验性字符串处理（可能影响注释换行）

# https://beta.ruff.rs/docs/settings/
[tool.ruff]
line-length = 120
# Exclude a variety of commonly ignored directories.
respect-gitignore = true

# https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = ["E", "W", "F"]
