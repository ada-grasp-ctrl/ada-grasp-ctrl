name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Verify project environment
        run: |
          python -c "import sys; print(f'Python executable: {sys.executable}'); assert sys.version_info[:2] == (3, 10), sys.version"
          python -c "import ada_grasp_ctrl, mujoco, numpy, omegaconf"
      - name: Install CI tools
        run: |
          python -m pip install ruff
      - name: Lint and format
        run: |
          ruff check src tests script
          ruff format --check src tests script
      - name: Unit, schema, and CLI tests
        env:
          MPLCONFIGDIR: /tmp/ada_grasp_ctrl_mpl
          PYTHONPYCACHEPREFIX: /tmp/ada_grasp_ctrl_pycache
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          python src/main.py --help

  quick:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hand: [shadow, allegro, leap_tac3d]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Run and validate bundled quick set
        env:
          ADA_GRASP_CTRL_EXAMPLE_BASE: ${{ github.workspace }}/quick-output
          ADA_GRASP_CTRL_RUN_ID: ci-${{ matrix.hand }}
          MPLCONFIGDIR: /tmp/ada_grasp_ctrl_mpl
        run: |
          status=0
          bash script/run_example.sh "${{ matrix.hand }}" quick || status=$?
          if (( status > 1 )); then exit "${status}"; fi
          python script/validate_quick_results.py verify \
            --manifest examples/quick_manifest.json \
            --expected examples/quick_expected_status.json \
            --hand "${{ matrix.hand }}" \
            --output-root "${ADA_GRASP_CTRL_EXAMPLE_BASE}/${{ matrix.hand }}/${ADA_GRASP_CTRL_RUN_ID}"
