name: Release gates

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hand: [shadow, allegro, leap_tac3d]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Verify project environment
        run: |
          python -c "import sys; print(f'Python executable: {sys.executable}'); assert sys.version_info[:2] == (3, 10), sys.version"
          python -c "import ada_grasp_ctrl, mujoco, numpy, omegaconf"
      - name: Run quick release job
        env:
          ADA_GRASP_CTRL_EXAMPLE_BASE: ${{ github.workspace }}/release-gate-output
          ADA_GRASP_CTRL_RUN_ID: release-${{ matrix.hand }}
          MPLCONFIGDIR: /tmp/ada_grasp_ctrl_mpl
        run: |
          status=0
          bash script/run_example.sh "${{ matrix.hand }}" quick || status=$?
          if (( status > 1 )); then exit "${status}"; fi
          python script/validate_quick_results.py verify \
            --manifest examples/quick_manifest.json \
            --expected examples/quick_expected_status.json \
            --hand "${{ matrix.hand }}" \
            --output-root "${ADA_GRASP_CTRL_EXAMPLE_BASE}/${{ matrix.hand }}/${ADA_GRASP_CTRL_RUN_ID}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-release-${{ matrix.hand }}
          path: release-gate-output/${{ matrix.hand }}/release-${{ matrix.hand }}
