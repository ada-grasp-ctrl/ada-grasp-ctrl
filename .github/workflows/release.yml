name: Release gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Release gate to execute
        required: true
        default: portable
        type: choice
        options:
          - quick
          - fixed
          - wheel
          - portable
          - release300
          - all
      release_input_root:
        description: Absolute self-hosted path containing learn_dummy_arm_<hand>/graspdata
        required: false
        type: string

jobs:
  portable:
    if: ${{ inputs.gate != 'release300' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Run portable release gates
        env:
          ADA_GRASP_CTRL_RELEASE_GATE_ROOT: ${{ github.workspace }}/release-gate-output
          MPLCONFIGDIR: /tmp/ada_grasp_ctrl_mpl
        run: |
          selected="${{ inputs.gate }}"
          if [[ "${selected}" == "all" ]]; then selected="portable"; fi
          bash script/run_release_gate.sh "${selected}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-release-gate-${{ inputs.gate }}
          path: release-gate-output

  release300:
    if: ${{ inputs.gate == 'release300' || inputs.gate == 'all' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Run 300-episode release gate
        env:
          ADA_GRASP_CTRL_RELEASE_GATE_ROOT: ${{ github.workspace }}/release-gate-output
          ADA_GRASP_CTRL_RELEASE_INPUT_ROOT: ${{ inputs.release_input_root }}
          MPLCONFIGDIR: /tmp/ada_grasp_ctrl_mpl
        run: bash script/run_release_gate.sh release300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release300-gate
          path: release-gate-output
